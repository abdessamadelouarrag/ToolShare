services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: toolshare_backend
    restart: always
    init: true
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/toolshare?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - toolshare-net

  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    container_name: toolshare_mongo
    restart: always
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          try {
            quit(rs.status().myState === 1 ? 0 : 1);
          } catch (error) {
            if (error.code !== 94) throw error;
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
            quit(1);
          }
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - toolshare-net

volumes:
  mongo_data:
    driver: local

networks:
  toolshare-net:
    driver: bridge
