services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: toolshare_backend
    restart: always
    init: true
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/toolshare
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - toolshare-net

  mongo:
    image: mongo:7.0
    container_name: toolshare_mongo
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - toolshare-net

volumes:
  mongo_data:
    driver: local

networks:
  toolshare-net:
    driver: bridge
